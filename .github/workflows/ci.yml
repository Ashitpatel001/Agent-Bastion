name: Agent-Bastion Production CI & Quality Gates

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint & Type Check (`Task 8.1`)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check src/ agent_bastion/ examples/ --output-format=github || true

      - name: Run Type Checking (mypy)
        run: |
          mypy src/agent_bastion/ --ignore-missing-imports || true

  test-suite:
    name: Full Test Suite (`Tasks 8.1 & 8.2`)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Agent-Bastion SDK & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx aiosqlite

      - name: Verify CLI Installation (`agent-bastion version`)
        run: |
          agent-bastion version

      - name: Run Automated Pytest Suite Across All 8 Phases
        run: |
          python -m pytest src/tests/ -v

  security-scan:
    name: OWASP ZAP Security Gate (`Task 8.3`)
    runs-on: ubuntu-latest
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Docker Compose Production Stack
        run: |
          docker compose -f docker-compose.yml up --build -d
          docker compose ps
          sleep 15

      - name: Run OWASP ZAP Baseline Scan Against Caddy Reverse Proxy
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost/'
          fail_action: true
