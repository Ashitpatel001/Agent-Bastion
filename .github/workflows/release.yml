name: Agent-Bastion Production Release & PyPI Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish to PyPI (`Task 5 Release Readiness`)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Source Distribution & Wheel
        run: |
          python -m build

      - name: Verify Package Distribution Integrity
        run: |
          twine check dist/*

      - name: Publish Package to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
