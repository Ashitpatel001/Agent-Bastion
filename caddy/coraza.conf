# ============================================================
# Coraza WAF Configuration for Agent-Bastion (Task 7.2)
# OWASP Core Rule Set (CRS) Integration
# NOTE: No prompt-injection rules at WAF level — those belong in InputSanitizationLayer.
# WAF handles SQLi, XSS, path traversal, and protocol violations.
# ============================================================

SecRuleEngine On

SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecResponseBodyAccess Off

SecAuditEngine RelevantOnly
SecAuditLogParts ABDEFHIJZ
SecAuditLog /var/log/caddy/coraza_audit.log
SecAuditLogFormat JSON

# Set OWASP CRS Setup & Configuration
SecAction \
    "id:900990,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.crs_setup_version=330,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# OWASP CRS Rule Categories Enabled:
# - Protocol Violations (920xxx)
# - Path Traversal / LFI / RFI (930xxx, 931xxx)
# - Remote Code Execution / Command Injection (932xxx)
# - PHP Injection (933xxx)
# - Cross-Site Scripting XSS (941xxx)
# - SQL Injection SQLi (942xxx)
# - Session Fixation (943xxx)

# Explicit exclusion: Do NOT inspect for LLM/Prompt Injection at WAF layer.
# Prompt injections and semantic payload evaluation are strictly handled in Python app layer (`InputSanitizationLayer`).
