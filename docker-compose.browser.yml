version: '3.8'
services:
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: abs-browserless
    ports:
    - 3001:3000
    environment:
    - MAX_CONCURRENT_SESSIONS=10
    - CONNECTION_TIMEOUT=300000
    - WORKSPACE_DIR=/tmp
    restart: unless-stopped
    networks:
    - abs-backend
