x-backend-env:
  PYTHONPATH: /app/src:/app
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-abs_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_secret_change_me}
  POSTGRES_DB: ${POSTGRES_DB:-abs_db}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://abs_user:abs_secret_change_me@postgres:5432/abs_db}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  ENV: production
  ENVIRONMENT: production
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
  ENABLE_BROWSER_EXECUTION: ${ENABLE_BROWSER_EXECUTION:-false}
  ENABLE_AGENT_RUNTIME: ${ENABLE_AGENT_RUNTIME:-true}
services:
  postgres:
    image: postgres:16-alpine
    container_name: abs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-abs_db}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER:-abs_user} -d $${POSTGRES_DB:-abs_db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
    - abs-backend
  redis:
    image: redis:7-alpine
    container_name: abs-redis
    command: "redis-server\n  --appendonly yes\n  --maxmemory 256mb\n  --maxmemory-policy\
      \ allkeys-lru\n  --save 60 1000\n"
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - abs-backend
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: abs-db-init
    command:
    - python
    - -c
    - import asyncio; from db.database import init_db; asyncio.run(init_db())
    environment:
      PYTHONPATH: /app/src:/app
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-abs_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://abs_user:abs_secret_change_me@postgres:5432/abs_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENV: production
      ENVIRONMENT: production
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      ENABLE_BROWSER_EXECUTION: ${ENABLE_BROWSER_EXECUTION:-false}
      ENABLE_AGENT_RUNTIME: ${ENABLE_AGENT_RUNTIME:-true}
    env_file:
    - path: .env
      required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - abs-backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: abs-api
    command:
    - uvicorn
    - src.api.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --workers
    - '2'
    environment:
      PYTHONPATH: /app/src:/app
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-abs_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://abs_user:abs_secret_change_me@postgres:5432/abs_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENV: production
      ENVIRONMENT: production
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      ENABLE_BROWSER_EXECUTION: ${ENABLE_BROWSER_EXECUTION:-false}
      ENABLE_AGENT_RUNTIME: ${ENABLE_AGENT_RUNTIME:-true}
    env_file:
    - path: .env
      required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - abs-backend
    - abs-frontend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
  worker-agent:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: abs-worker-agent
    command:
    - celery
    - -A
    - src.workers.celery_app
    - worker
    - -Q
    - agents
    - --loglevel=info
    - --concurrency=1
    environment:
      PYTHONPATH: /app/src:/app
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-abs_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://abs_user:abs_secret_change_me@postgres:5432/abs_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENV: production
      ENVIRONMENT: production
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      ENABLE_BROWSER_EXECUTION: ${ENABLE_BROWSER_EXECUTION:-false}
      ENABLE_AGENT_RUNTIME: ${ENABLE_AGENT_RUNTIME:-true}
    env_file:
    - path: .env
      required: false
    volumes:
    - agent_screenshots:/app/src/security/dashboard/screenshots
    - agent_diffs:/app/src/security/dashboard/diffs
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A src.workers.celery_app status || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - abs-backend
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
    - seccomp:unconfined
    shm_size: 512m
  worker-xai:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: abs-worker-xai
    command:
    - celery
    - -A
    - src.workers.celery_app
    - worker
    - -Q
    - xai
    - --loglevel=info
    - --concurrency=2
    environment:
      PYTHONPATH: /app/src:/app
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-abs_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://abs_user:abs_secret_change_me@postgres:5432/abs_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENV: production
      ENVIRONMENT: production
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      ENABLE_BROWSER_EXECUTION: ${ENABLE_BROWSER_EXECUTION:-false}
      ENABLE_AGENT_RUNTIME: ${ENABLE_AGENT_RUNTIME:-true}
    env_file:
    - path: .env
      required: false
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A src.workers.celery_app status || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - abs-backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: runner
    container_name: abs-frontend
    environment:
    - NEXT_PUBLIC_API_URL=/api
    depends_on:
    - api
    restart: unless-stopped
    networks:
    - abs-frontend
  caddy:
    image: caddy:2-alpine
    container_name: abs-caddy
    ports:
    - ${CADDY_HTTP_PORT:-80}:80
    - ${CADDY_HTTPS_PORT:-443}:443
    - ${CADDY_HTTPS_PORT:-443}:443/udp
    environment:
    - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    - caddy_logs:/var/log/caddy
    depends_on:
    - api
    - frontend
    restart: unless-stopped
    networks:
    - abs-backend
    - abs-frontend
volumes:
  postgres_data: null
  redis_data: null
  agent_screenshots: null
  agent_diffs: null
  caddy_data: null
  caddy_config: null
  caddy_logs: null
networks:
  abs-backend:
    driver: bridge
    internal: true
  abs-frontend:
    driver: bridge
