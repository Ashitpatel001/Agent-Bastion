# ============================================================
# fail2ban Filter: abs-auth (Auth Brute Force Detection)
# Matches 401 Unauthorized / auth failure metrics in Caddy JSON access logs
# ============================================================

[Definition]
failregex = ^.*"remote_host":"<HOST>".*"uri":"/api/v[0-9]+/auth/.*".*"status":401.*$
            ^.*"client_ip":"<HOST>".*"uri":"/api/v[0-9]+/auth/.*".*"status":401.*$
            ^.*"remote_addr":"<HOST>".*"uri":"/api/v[0-9]+/auth/.*".*"status":401.*$

ignoreregex =
