# ============================================================
# fail2ban Filter: abs-flood (HTTP Flood Protection)
# Matches all incoming HTTP requests to track velocity in Caddy JSON logs
# ============================================================

[Definition]
failregex = ^.*"remote_host":"<HOST>".*"request":\{.*$
            ^.*"client_ip":"<HOST>".*"request":\{.*$
            ^.*"remote_addr":"<HOST>".*"request":\{.*$

ignoreregex = ^.*"remote_host":"(127\.0\.0\.1|::1)".*$
