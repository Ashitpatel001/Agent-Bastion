# ============================================================
# fail2ban Filter: abs-scanner (Scanner Detection)
# Matches repeated HTTP 404 responses in Caddy JSON access logs
# ============================================================

[Definition]
failregex = ^.*"remote_host":"<HOST>".*"status":404.*$
            ^.*"client_ip":"<HOST>".*"status":404.*$
            ^.*"remote_addr":"<HOST>".*"status":404.*$

ignoreregex = ^.*"uri":"/favicon\.ico".*$
