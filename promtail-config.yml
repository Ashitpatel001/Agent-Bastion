server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/lapi/v1/push

scrape_configs:
  # Scrape Docker container logs and application structured JSON logs
  - job_name: abs-docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(abs-.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(abs-api|abs-worker-.*|abs-db-init|abs-flower)'
        target_label: 'service'
      - replacement: 'docker'
        target_label: 'job'
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            session_id: session_id
            tenant_id: tenant_id
            event_type: event_type
      - labels:
          level:
          logger:
          tenant_id:
          event_type:
      - timestamp:
          source: timestamp
          format: RFC3339
