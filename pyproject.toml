[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abs-security-proxy"
version = "2.0.0"
description = "Multi-Tenant AI Browser Security Proxy — Zero-Trust defense for autonomous web agents."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ==========================
    # Browser Automation
    # ==========================
    "browser-use",
    "playwright",

    # ==========================
    # LLM
    # ==========================
    "groq",
    "langchain",
    "langchain-core",
    "langchain-groq>=0.2.0",
    "langchain-openai",

    # Optional providers
    "openai",

    # ==========================
    # Configuration
    # ==========================
    "python-dotenv>=1.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",

    # ==========================
    # Database
    # ==========================
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "alembic>=1.13",

    # ==========================
    # API
    # ==========================
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "flask>=3.0",

    # ==========================
    # Dashboard
    # ==========================
    "streamlit>=1.36",

    # ==========================
    # Workers
    # ==========================
    "celery[redis]>=5.4",
    "redis>=5.0",

    # ==========================
    # Networking
    # ==========================
    "httpx>=0.27",
    "requests>=2.32",
    "beautifulsoup4>=4.12",

    # ==========================
    # Security
    # ==========================
    "cryptography>=43",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # ==========================
    # Utilities
    # ==========================
    "tenacity>=9.0",
    "orjson>=3.10",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "api*",
    "db*",
    "security*",
    "workers*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"